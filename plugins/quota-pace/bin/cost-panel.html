<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Claude Code cost</title>
<!-- Static local dashboard for cost. `cost --panel` copies this file to <config dir>/cost/panel/index.html with the
     data embedded in the <script id="data"> block below. No network, no external script, font or image: open it with file://. -->
<style>
:root{--bg:#fafaf7;--fg:#1d1d1b;--mut:#6b6a63;--card:#fff;--line:#deddd5;--main:#2f6fb0;--sub:#d9822b;--bar:#2f6fb0}
@media (prefers-color-scheme:dark){:root{--bg:#171715;--fg:#ecebe4;--mut:#9c9b92;--card:#21211f;--line:#34332f;--main:#6aa6e0;--sub:#e8a35a;--bar:#6aa6e0}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:1000px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:20px;margin:0 0 4px}h2{font-size:15px;margin:24px 0 8px}
.note{color:var(--mut);font-size:12px;margin:0 0 14px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 14px}
.tabs button{border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:6px;padding:5px 12px;cursor:pointer;font:inherit}
.tabs button[aria-pressed=true]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.cards div{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.cards b{display:block;font-size:20px;font-variant-numeric:tabular-nums}.cards span{color:var(--mut);font-size:12px}
svg{width:100%;height:auto;display:block;background:var(--card);border:1px solid var(--line);border-radius:8px}
.legend{font-size:12px;color:var(--mut);margin:4px 0}.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin:0 4px 0 10px;vertical-align:baseline}
.tw{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:8px}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{padding:5px 10px;text-align:right;white-space:nowrap}th:first-child,td:first-child{text-align:left}
th{color:var(--mut);font-weight:500;border-bottom:1px solid var(--line)}tbody tr{cursor:pointer}tbody tr:hover,tbody tr[aria-selected=true]{background:color-mix(in srgb,var(--bar) 12%,transparent)}
.share{display:inline-block;height:8px;background:var(--bar);border-radius:2px;vertical-align:middle;margin-right:6px}
.empty{color:var(--mut);padding:14px}
</style>
</head>
<body>
<main>
<h1>Claude Code cost</h1>
<p class="note">The figures are the <b>API list-price equivalent</b> of the token usage (USD, advisor calls included), not a subscription bill. The data was computed on this machine only and sent nowhere.</p>
<div class="tabs" id="tabs" role="group" aria-label="View"></div>
<div class="cards" id="cards"></div>
<h2 id="periodsTitle">Periods</h2>
<div class="legend"><i style="background:var(--main)"></i>main session<i style="background:var(--sub)"></i>sub-agents · * partial period</div>
<svg id="chart" viewBox="0 0 800 220" role="img" aria-label="Cost per period"></svg>
<div class="tw"><table id="table"></table></div>
<h2 id="breakdownTitle">Breakdown</h2>
<div class="tw"><table id="breakdown"></table></div>
<p class="note" id="footer"></p>
</main>
<script type="application/json" id="data">__COST_DATA__</script>
<script>
"use strict";
var D = null;
try { D = JSON.parse(document.getElementById("data").textContent); } catch (e) { D = null; }
var NAMES = {day: "Day", week: "Week", month: "Month", year: "Year"};
var view = "day", selected = null;
var $ = function (id) { return document.getElementById(id); };
function el(tag, text, cls) { var e = document.createElement(tag); if (text !== undefined) e.textContent = text; if (cls) e.className = cls; return e; }
function usd(x, nd) { return "$" + Number(x || 0).toLocaleString("tr-TR", {minimumFractionDigits: nd === undefined ? 2 : nd, maximumFractionDigits: nd === undefined ? 2 : nd}); }
function percent(x) { return x == null ? "-" : Math.round(x * 100) + "%"; }
function count(x) { return Number(x || 0).toLocaleString("tr-TR"); }
function clear(n) { while (n.firstChild) n.removeChild(n.firstChild); }
function row(t, cells, th) { var tr = el("tr"); cells.forEach(function (h) { var c = el(th ? "th" : "td"); if (h instanceof Node) c.appendChild(h); else c.textContent = h; tr.appendChild(c); }); t.appendChild(tr); return tr; }

function draw() {
  if (!D || !D.periods || !D.periods.length) { $("cards").appendChild(el("div", "No data.", "empty")); return; }
  var tabs = $("tabs"); clear(tabs);
  Object.keys(NAMES).forEach(function (g) {
    var b = el("button", NAMES[g]); b.type = "button"; b.setAttribute("aria-pressed", g === view ? "true" : "false");
    b.onclick = function () { view = g; selected = null; draw(); }; tabs.appendChild(b);
  });
  var rows = D.periods.filter(function (r) { return r.view === view; });
  var sum = (D.summary || []).filter(function (r) { return r.view === view; })[0];
  var cards = $("cards"); clear(cards);
  if (!rows.length) { cards.appendChild(el("div", "No data in this view.", "empty")); clear($("chart")); clear($("table")); clear($("breakdown")); return; }
  if (sum) {
    [[usd(sum.total_usd), "total (" + sum.active_days + " active days)"], [usd(sum.avg_active_day_usd), "avg per active day"],
     [sum.busiest_label ? usd(sum.busiest_usd) : "-", "busiest: " + (sum.busiest_label || "-")],
     [percent(sum.hit), "cache hit rate"], [usd(sum.advisor_usd), "advisor calls"]].forEach(function (k) {
      var d = el("div"); d.appendChild(el("b", k[0])); d.appendChild(el("span", k[1])); cards.appendChild(d);
    });
  }
  // stacked bars: main + sub-agents per period (SVG built with the DOM API, no innerHTML)
  var g = $("chart"); clear(g);
  var NS = "http://www.w3.org/2000/svg", W = 800, H = 220, pad = 28, mx = Math.max.apply(null, rows.map(function (r) { return r.usd; })) || 1;
  var step = (W - 2 * pad) / rows.length, bw = Math.max(2, Math.min(36, step * 0.7));
  function rect(x, y, w, h, color) { var r = document.createElementNS(NS, "rect"); r.setAttribute("x", x); r.setAttribute("y", y); r.setAttribute("width", w); r.setAttribute("height", Math.max(0, h)); r.setAttribute("fill", color); g.appendChild(r); return r; }
  rows.forEach(function (r, i) {
    var x = pad + i * step + (step - bw) / 2, ha = (H - 2 * pad) * (r.main_usd / mx), hb = (H - 2 * pad) * (r.sub_usd / mx);
    var t1 = rect(x, H - pad - ha, bw, ha, "var(--main)"), t2 = rect(x, H - pad - ha - hb, bw, hb, "var(--sub)");
    [t1, t2].forEach(function (t) { var ti = document.createElementNS(NS, "title"); ti.textContent = r.label + ": " + usd(r.usd); t.appendChild(ti); });
    if (rows.length <= 16 || i % Math.ceil(rows.length / 16) === 0) {
      var tx = document.createElementNS(NS, "text"); tx.setAttribute("x", x + bw / 2); tx.setAttribute("y", H - 10); tx.setAttribute("text-anchor", "middle");
      tx.setAttribute("font-size", "10"); tx.setAttribute("fill", "var(--mut)"); tx.textContent = r.short + (r.partial ? "*" : ""); g.appendChild(tx);
    }
  });
  var tm = document.createElementNS(NS, "text"); tm.setAttribute("x", 4); tm.setAttribute("y", 14); tm.setAttribute("font-size", "10"); tm.setAttribute("fill", "var(--mut)"); tm.textContent = usd(mx, mx < 10 ? 2 : 0); g.appendChild(tm);
  // table
  var t = $("table"); clear(t);
  var th = el("thead"); t.appendChild(th); var trh = el("tr"); th.appendChild(trh);
  ["Period", "$", "main", "sub", "$/day", "requests", "cache"].forEach(function (h) { trh.appendChild(el("th", h)); });
  var tb = el("tbody"); t.appendChild(tb);
  rows.slice().reverse().forEach(function (r) {
    var tr = row(tb, [r.label + (r.partial ? "*" : ""), usd(r.usd), usd(r.main_usd), usd(r.sub_usd), usd(r.usd_day), count(r.request), percent(r.hit)]);
    tr.setAttribute("aria-selected", selected === r.key ? "true" : "false");
    tr.onclick = function () { selected = r.key; draw(); };
  });
  // breakdown of the selected period (default: the latest)
  var key = selected || rows[rows.length - 1].key, picked = rows.filter(function (r) { return r.key === key; })[0] || rows[rows.length - 1];
  $("breakdownTitle").textContent = "Breakdown: " + picked.label;
  var dt = $("breakdown"); clear(dt);
  var parts = (D.breakdowns || []).filter(function (k) { return k.view === view && k.key === picked.key; });
  [["model", "Model"], ["type", "Agent type"], ["project", "Project folder"], ["session", "Most expensive sessions"]].forEach(function (b) {
    var l = parts.filter(function (k) { return k.dimension === b[0]; }).sort(function (a, c) { return c.usd - a.usd; });
    if (!l.length) return;
    row(dt, [b[1], "$", "share"], true);
    l.forEach(function (k) {
      var box = el("span"); var bar = el("span", "", "share"); bar.style.width = Math.max(1, Math.round(k.share * 100)) + "px"; box.appendChild(bar); box.appendChild(document.createTextNode(percent(k.share)));
      row(dt, [k.name, usd(k.usd), box]);
    });
  });
  $("footer").textContent = D.summary && D.summary[0] ? "Created: " + D.summary[0].created + " · data: " + D.summary[0].first_day + " … " + D.summary[0].last_day : "";
}
draw();
</script>
</body>
</html>
